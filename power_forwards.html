<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Power Forward Height Sampling Simulator</title>
<style>
:root{
  --navy:#00274C; --maize:#FFCB05;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#55627A; --line:#D3D9E3; --stripe:#F6F8FB;
  --sym:#00274C; --sym-new:#FFCB05; --sym-new-ink:#00274C; --param:#B3261E;
  --btn-bg:#00274C; --btn-ink:#FFFFFF; --btn2-bg:#E4E8EF; --btn2-ink:#00274C;
  --focus:#2F6FDE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06111F; --surface:#0C1D33; --ink:#E9EEF6; --muted:#9AA8BF; --line:#22385A; --stripe:#102540;
    --sym:#FFCB05; --sym-new:#FFFFFF; --sym-new-ink:#00274C; --param:#FF8A80;
    --btn-bg:#FFCB05; --btn-ink:#00274C; --btn2-bg:#1A3050; --btn2-ink:#E9EEF6;
    --focus:#8AB4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06111F; --surface:#0C1D33; --ink:#E9EEF6; --muted:#9AA8BF; --line:#22385A; --stripe:#102540;
  --sym:#FFCB05; --sym-new:#FFFFFF; --sym-new-ink:#00274C; --param:#FF8A80;
  --btn-bg:#FFCB05; --btn-ink:#00274C; --btn2-bg:#1A3050; --btn2-ink:#E9EEF6;
  --focus:#8AB4FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:6px solid var(--maize)}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header .wrap{padding-top:22px;padding-bottom:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;justify-content:space-between}
h1{font:800 clamp(26px,4.2vw,40px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;letter-spacing:-.01em}
.pop{font-size:15px;color:#C9D4E5}
.pop b{color:var(--maize);font-weight:700}
main.wrap{padding-top:20px;padding-bottom:40px}
.controls{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-end}
.group{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.divider{width:1px;align-self:stretch;background:var(--line)}
.field label{display:block;font:700 14px/1.2 system-ui,sans-serif;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input[type=number]{width:110px;font:700 22px/1 system-ui,sans-serif;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.field input:focus-visible,button:focus-visible,.chk input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:700 18px/1 system-ui,sans-serif;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.primary{background:var(--btn-bg);color:var(--btn-ink)}
.secondary{background:var(--btn2-bg);color:var(--btn2-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.toggles{display:flex;flex-wrap:wrap;gap:8px 18px;width:100%}
.chk{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.msg{min-height:1.5em;margin:10px 2px 0;font-size:15px;color:var(--muted)}
.msg.err{color:var(--param);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:14px 18px}
.plot{padding:10px 12px 12px}
.plot svg{display:block;width:100%;height:auto}
.stats{display:flex;flex-wrap:wrap;gap:4px 26px;padding:4px 8px 0;font-size:16px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.m{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.2em;color:var(--ink)}
h2{font:800 21px/1.2 system-ui,sans-serif;margin:0 0 6px}
.calc{font-size:18px;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;flex-direction:column;align-items:center;min-width:62px;padding:4px 8px 6px;border-radius:6px;background:var(--navy);color:#fff;line-height:1.1}
:root[data-theme="dark"] .chip{background:var(--maize);color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip{background:var(--maize);color:var(--navy)}}
.chip small{font-size:12px;opacity:.85}
.chip span{font:700 22px system-ui,sans-serif}
.empty{color:var(--muted);margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols .panel{margin-top:16px}
.logwrap{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);border-bottom:2px solid var(--line);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tbody tr:nth-child(even){background:var(--stripe)}
td.xb{font-weight:700}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}
@media (max-width:800px){ .cols{grid-template-columns:1fr} .divider{display:none} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Sampling NBA Power Forward Heights</h1>
    <div class="pop">Population: <b>115</b> power forwards</div>
  </div>
</header>
<main class="wrap">
  <section class="controls" aria-label="Simulation controls">
    <div class="field">
      <label for="n">Sample size</label>
      <input id="n" type="number" min="1" max="115" step="1" value="5" inputmode="numeric">
    </div>
    <div class="divider"></div>
    <div class="group">
      <button class="primary" id="one">Take 1 sample</button>
    </div>
    <div class="divider"></div>
    <div class="group">
      <div class="field">
        <label for="numSamples">Number of samples</label>
        <input id="numSamples" type="number" min="1" max="1000" step="1" value="30" inputmode="numeric">
      </div>
      <button class="primary" id="go">Take samples</button>
    </div>
    <div class="group"><button class="secondary" id="reset">Clear</button></div>
    <div class="toggles">
      <label class="chk"><input type="checkbox" id="animate" checked> Add samples one at a time</label>
      <label class="chk"><input type="checkbox" id="showParam"> Show population mean</label>
    </div>
  </section>
  <p class="msg" id="msg" role="status"></p>

  <section class="panel plot" aria-label="Dotplot of sample means">
    <svg id="svgM" viewBox="0 0 960 350" role="img"></svg>
    <div class="stats" id="statsM"></div>
  </section>

  <div class="cols">
    <section class="panel" aria-live="polite">
      <h2>Most recent sample</h2>
      <div id="lastBody"><p class="empty">Press Take 1 sample to randomly select players. Their heights and the sample mean will show here.</p></div>
    </section>
    <section class="panel">
      <h2>Sample log</h2>
      <div id="logBody"><p class="empty">Every sample you take is listed here in order.</p></div>
    </section>
  </div>
</main>

<script>
(function(){
  // Heights (inches) for players #1–#115 (index 0 = player #1)
  const DATA=[80,79,80,80,80,80,80,80,82,78,80,79,80,82,83,78,82,81,81,81,78,83,81,79,80,81,82,78,79,81,82,79,80,81,78,80,81,80,80,82,81,81,80,79,77,78,82,80,77,81,80,78,80,79,80,78,84,79,80,81,78,83,81,82,80,81,81,79,80,77,82,81,82,79,80,81,81,81,79,82,80,78,80,78,78,80,80,77,79,82,78,77,82,79,80,80,80,80,80,83,80,81,79,78,84,79,79,81,80,80,80,79,82,81,80];
  const N=DATA.length;
  const MU=DATA.reduce((a,b)=>a+b,0)/N;
  const SVGNS="http://www.w3.org/2000/svg";
  const LO=77, HI=84;

  const $=id=>document.getElementById(id);
  const nIn=$("n"), kIn=$("numSamples"), msg=$("msg");
  let samples=[], currentN=null, busy=false, timer=null;
  const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion) $("animate").checked=false;

  function setMsg(t,err){ msg.textContent=t||""; msg.className="msg"+(err?" err":""); }
  function readInt(el,lo,hi,name){
    const v=Number(el.value);
    if(!Number.isInteger(v)||v<lo||v>hi){ setMsg(`${name} must be a whole number from ${lo} to ${hi}.`,true); el.focus(); return null; }
    return v;
  }

  function drawSample(n){
    // Simple random sample without replacement
    const pool=Array.from({length:N},(_,i)=>i);
    for(let i=0;i<n;i++){ const j=i+Math.floor(Math.random()*(N-i)); [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const idx=pool.slice(0,n);
    const sum=idx.reduce((a,i)=>a+DATA[i],0);
    return {idx,sum,xbar:sum/n};
  }

  function ensureN(n){
    if(currentN!==null && currentN!==n && samples.length){ samples=[]; setMsg(`Sample size changed to ${n}, so the dotplot was cleared.`); }
    currentN=n;
  }
  function setButtons(){ ["one","go"].forEach(id=>$(id).disabled=busy); nIn.disabled=busy; kIn.disabled=busy; }

  function addSamples(k,n){
    const animate=$("animate").checked && k>1 && !reduceMotion;
    if(!animate){ for(let i=0;i<k;i++) samples.push(drawSample(n)); renderAll(); return; }
    busy=true; setButtons();
    let done=0; const delay=Math.max(20,Math.min(250,4000/k));
    timer=setInterval(()=>{
      samples.push(drawSample(n)); done++; renderAll();
      if(done>=k){ clearInterval(timer); timer=null; busy=false; setButtons(); }
    },delay);
  }

  $("one").addEventListener("click",()=>{
    const n=readInt(nIn,1,N,"Sample size"); if(n===null) return;
    setMsg(""); ensureN(n); addSamples(1,n);
  });
  $("go").addEventListener("click",()=>{
    const n=readInt(nIn,1,N,"Sample size"); if(n===null) return;
    const k=readInt(kIn,1,1000,"Number of samples"); if(k===null) return;
    if(samples.length+k>10000){ setMsg("The dotplot holds up to 10,000 samples. Press Clear to start again.",true); return; }
    setMsg(""); ensureN(n); addSamples(k,n);
  });
  $("reset").addEventListener("click",()=>{
    if(timer){clearInterval(timer);timer=null;busy=false;setButtons();}
    samples=[]; currentN=null; setMsg("Cleared."); renderAll();
  });
  $("showParam").addEventListener("change",renderAll);
  nIn.addEventListener("change",()=>{
    const v=Number(nIn.value);
    if(Number.isInteger(v)&&v>=1&&v<=N&&samples.length&&v!==currentN){ samples=[]; currentN=v; setMsg(`Sample size changed to ${v}, so the dotplot was cleared.`); }
    renderAll();
  });
  kIn.addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });
  nIn.addEventListener("keydown",e=>{ if(e.key==="Enter") $("one").click(); });

  // ---------- Dotplot ----------
  const W=960,ML=34,MR=34,MT=16,LABEL_BAND=28,BOTTOM=76,MIN_AREA=230,MAX_AREA=560,PW=W-ML-MR;
  function el(tag,attrs,parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

  function drawPlot(svg,values,step,label){
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const sx=v=>ML+(v-LO)/(HI-LO)*PW;
    const spacingPx=step/(HI-LO)*PW, MINCOL=14, BASE=24;
    let colW,keyOf,xOf;
    if(spacingPx>=MINCOL){ colW=Math.min(BASE,spacingPx); keyOf=v=>Math.round((v-LO)/step); xOf=k=>sx(LO+k*step); }
    else { colW=MINCOL; keyOf=v=>Math.round((sx(v)-ML)/colW); xOf=k=>ML+k*colW; }
    const stacks=new Map();
    values.forEach(o=>{ const k=keyOf(o.v); if(!stacks.has(k)) stacks.set(k,[]); stacks.get(k).push(o); });
    let maxStack=0; stacks.forEach(a=>{ if(a.length>maxStack) maxStack=a.length; });
    const area=Math.max(MIN_AREA,Math.min(MAX_AREA,maxStack*colW*1.05+4));
    const H=MT+LABEL_BAND+area+BOTTOM, AXIS_Y=H-BOTTOM;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);

    const css=getComputedStyle(document.documentElement);
    const v=n=>css.getPropertyValue(n).trim();
    const ink=v("--ink"),muted=v("--muted"),symC=v("--sym"),newBg=v("--sym-new"),newInk=v("--sym-new-ink"),paramC=v("--param");
    const font="system-ui, -apple-system, 'Segoe UI', sans-serif";

    el("line",{x1:ML,x2:W-MR,y1:AXIS_Y,y2:AXIS_Y,stroke:ink,"stroke-width":1.5},svg);
    for(let t=LO;t<=HI+1e-9;t+=0.5){
      const x=sx(t), major=Number.isInteger(t);
      el("line",{x1:x,x2:x,y1:AXIS_Y,y2:AXIS_Y+(major?8:5),stroke:ink,"stroke-width":major?1.5:1},svg);
      if(major){ const tx=el("text",{x,y:AXIS_Y+27,"text-anchor":"middle","font-size":16,fill:ink,"font-family":font},svg); tx.textContent=t; }
    }
    const lab=el("text",{x:ML+PW/2,y:H-18,"text-anchor":"middle","font-size":19,"font-weight":700,fill:ink,"font-family":font},svg);
    lab.textContent=label;

    if(!values.length){
      const e=el("text",{x:ML+PW/2,y:MT+LABEL_BAND+area/2,"text-anchor":"middle","font-size":17,fill:muted,"font-family":font},svg);
      e.textContent="No samples yet";
    }

    const rowH=Math.min(colW*1.05, maxStack?area/maxStack:colW);
    const size=Math.min(colW,rowH/1.05);
    const g=el("g",{},svg);
    stacks.forEach((arr,k)=>{
      const x=xOf(k);
      arr.forEach((o,i)=>{
        const yBottom=AXIS_Y-3-i*rowH;
        if(o.isNew) el("rect",{x:x-size/2,y:yBottom-rowH+0.5,width:size,height:Math.max(rowH-1,1),rx:Math.min(3,size/5),fill:newBg},g);
        const c=o.isNew?newInk:symC;
        if(size<7){ el("circle",{cx:x,cy:yBottom-rowH/2,r:Math.max(size/2-0.5,1),fill:c},g); return; }
        // x-bar: italic x with a bar drawn above it
        const fs=size*0.95, base=yBottom-rowH*0.24;
        const t=el("text",{x,y:base,"text-anchor":"middle","font-size":fs,"font-style":"italic","font-weight":600,fill:c,"font-family":"'Times New Roman',Times,serif"},g);
        t.textContent="x";
        const yb=base-fs*0.66, half=fs*0.24;
        el("line",{x1:x-half+fs*0.03,x2:x+half+fs*0.03,y1:yb,y2:yb,stroke:c,"stroke-width":Math.max(1,size*0.08),"stroke-linecap":"round"},g);
      });
    });

    if($("showParam").checked){
      const x=sx(MU);
      el("line",{x1:x,x2:x,y1:MT,y2:AXIS_Y,stroke:paramC,"stroke-width":2,"stroke-dasharray":"7 5"},svg);
      const t=el("text",{x:x+8,y:MT+14,"font-size":17,"font-weight":700,fill:paramC,"font-family":font},svg);
      t.textContent=`μ = ${MU.toFixed(3)} in`;
    }
  }

  const fmt=x=>x.toFixed(2);
  const XB='<span class="m">x̄</span>';

  function renderAll(){
    const nShow=currentN ?? (Number.isInteger(Number(nIn.value))&&Number(nIn.value)>=1?Number(nIn.value):5);
    const last=samples[samples.length-1];
    drawPlot($("svgM"),samples.map(s=>({v:s.xbar,isNew:s===last})),1/nShow,
      `Sample Mean Height of Power Forwards, inches (sample size = ${nShow})`);
    $("svgM").setAttribute("aria-label",`Dotplot of ${samples.length} sample means`);

    const k=samples.length;
    if(k){
      const xs=samples.map(s=>s.xbar), mean=xs.reduce((a,b)=>a+b,0)/k;
      const sd=k>1?Math.sqrt(xs.reduce((a,b)=>a+(b-mean)**2,0)/(k-1)):null;
      $("statsM").innerHTML=`<span>Samples: <b>${k}</b></span><span>Mean of ${XB} values: <b>${mean.toFixed(3)}</b> in</span><span>SD of ${XB} values: <b>${sd==null?"—":sd.toFixed(3)}</b> in</span>`;
    } else $("statsM").innerHTML="";

    if(!last){
      $("lastBody").innerHTML='<p class="empty">Press Take 1 sample to randomly select players. Their heights and the sample mean will show here.</p>';
      $("logBody").innerHTML='<p class="empty">Every sample you take is listed here in order.</p>';
      return;
    }
    const n=last.idx.length;
    const chips=last.idx.map(i=>`<div class="chip" title="Player #${i+1}: ${DATA[i]} inches"><small>Player #${i+1}</small><span>${DATA[i]}</span></div>`).join("");
    const sumStr=n<=10?last.idx.map(i=>DATA[i]).join(" + "):String(last.sum);
    $("lastBody").innerHTML=`<p class="calc">Sample #${k}: ${XB} = (${sumStr}) / ${n} = <b>${fmt(last.xbar)}</b> inches</p><div class="chips">${chips}</div>`;

    // Sample log (show the most recent 300 rows to keep it fast)
    const start=Math.max(0,k-300);
    let rows="";
    for(let s=start;s<k;s++){
      const sm=samples[s];
      const hts=n<=10?sm.idx.map(i=>DATA[i]).join(", "):`${n} players`;
      rows+=`<tr><td>${s+1}</td><td>${hts}</td><td class="xb">${fmt(sm.xbar)}</td></tr>`;
    }
    $("logBody").innerHTML=`<div class="logwrap" id="logwrap"><table><thead><tr><th>Sample</th><th>Heights (in)</th><th>${XB}</th></tr></thead><tbody>${rows}</tbody></table></div>`+
      (start>0?`<p class="note">Showing the most recent 300 samples.</p>`:"");
    const lw=$("logwrap"); lw.scrollTop=lw.scrollHeight;
  }

  if(window.matchMedia){ const mq=window.matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener?mq.addEventListener("change",renderAll):mq.addListener(renderAll)); }
  renderAll();
})();
</script>
</body>
</html>
